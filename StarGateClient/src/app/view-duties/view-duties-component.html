<div mat-dialog-title class="dialog-title">
  <button mat-icon-button aria-label="close dialog" mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
</div>
<div mat-dialog-content class="content">
  <div class="dialog-head">
    <h3>All Duties For : {{personName}} </h3>
  </div>
  <div class="table-container">
    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="DutyTitle">
        <th mat-header-cell *matHeaderCellDef> Duty Title </th>
        <td mat-cell *matCellDef="let row"> {{row.dutyTitle}} </td>
      </ng-container>

      <ng-container matColumnDef="DutyStartDate">
        <th mat-header-cell *matHeaderCellDef> Start Date </th>
        <td mat-cell *matCellDef="let row"> {{row.dutyStartDate | date:'shortDate' }}</td>
      </ng-container>

      <ng-container matColumnDef="DutyEndDate">
        <th mat-header-cell *matHeaderCellDef> End Date </th>
        <td mat-cell *matCellDef="let row"> {{row.dutyEndDate | date:'shortDate' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>
</div>
